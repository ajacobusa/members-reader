universe:
  include_sp500: true
  include_ndx100: true
  extra_tickers: []

quality_filter:
  min_market_cap_b: 10
  min_avg_volume: 1000000
  require_profitable: true

market_conditions:
  max_vix: 25
  require_above_50sma: true
  min_fear_greed: 30

catalysts:
  earnings_beat:
    enabled: true
    min_beat_pct: 5
    lookback_days: 3
  analyst_upgrade:
    enabled: true
    lookback_days: 3
  volume_breakout:
    enabled: true
    multiplier: 2.0
  high_52w_breakout:
    enabled: true
  guidance_raised:
    enabled: true
  price_target_increase:
    enabled: true
    min_increase_pct: 10

technical_gates:
  rsi_min: 40
  rsi_max: 70
  require_above_20sma: true
  require_macd_bullish: true
  max_extension_pct: 15

scoring:
  technical_weight: 0.35
  fundamental_weight: 0.35
  catalyst_weight: 0.20
  pattern_weight: 0.10
  top_n: 10

signals:
  rsi: {enabled: true, weight: 1.0}
  macd: {enabled: true, weight: 1.0}
  momentum_20d: {enabled: true, weight: 1.0}
  volume_ratio: {enabled: true, weight: 1.0}
  sma_crossover: {enabled: true, weight: 1.0}
  eps_growth: {enabled: true, weight: 1.0}
  revenue_growth: {enabled: true, weight: 1.0}
  pe_vs_sector: {enabled: true, weight: 1.0}
  analyst_consensus: {enabled: true, weight: 1.0}
  profit_margin: {enabled: true, weight: 1.0}

api_keys:
  alpha_vantage: ""
  benzinga: ""
  newsapi: ""

email:
  enabled: true
  recipient: ajacobusa@gmail.com
  sender: ajacobusa@gmail.com
  app_password: ""
  smtp_host: smtp.gmail.com
  smtp_port: 587

schedule:
  time: "07:30"
  days: [MON, TUE, WED, THU, FRI]
  skip_market_holidays: true

output:
  db_path: db/stocks.db
  export_csv: true

factor_weights:
  earnings_surprise:   {enabled: true, weight: 0.15}
  analyst_revision:    {enabled: true, weight: 0.15}
  options_flow:        {enabled: true, weight: 0.20}
  relative_volume:     {enabled: true, weight: 0.10}
  institutional:       {enabled: true, weight: 0.10}
  insider:             {enabled: true, weight: 0.10}
  technical_momentum:  {enabled: true, weight: 0.10}
  sector_strength:     {enabled: true, weight: 0.10}

statistics:
  return_lookback_days: 120
  earnings_lookback_quarters: 8
  ci_sigma_multiplier: 1.5
  conditioning: "catalyst"

enrichment:
  conviction_blend: 0.5

sizing:
  kelly_multiplier: 0.5
  max_position_pct: 10.0
  max_total_pct: 100.0

probability_filter:
  enabled: true
  min_composite_score: 80
  min_expected_return_pct: 1.0
  min_probability_gain: 0.60
  min_risk_reward: 2.0
  cost_slippage_haircut_pct: 0.3

backtest:
  years: 3
  preferred_timing: "C"
  auto_tune: true
  schedule_day: SAT
  min_sample_trades: 200
  min_improvement_pct: 0.2
  min_factor_significance: 0.6

performance:
  max_workers: 12
  bulk_ohlc: true
  enrich_only_survivors: true
  cache_ttl_hours: 18
  cache_dir: "cache"

health:
  enabled: true
  min_fetch_success_rate: 0.85
  alert_on_degraded: true
  abort_if_no_market_data: true
