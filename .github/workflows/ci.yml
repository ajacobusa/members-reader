name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Syntax-check all Python sources
        run: |
          python - <<'EOF'
          import ast, glob, sys
          errors = []
          for path in sorted(glob.glob("quoteforge/**/*.py", recursive=True)
                             + glob.glob("quoteforge/*.py")
                             + glob.glob("quoteforge_tests/**/*.py", recursive=True)
                             + glob.glob("src/**/*.py", recursive=True)):
              try:
                  ast.parse(open(path, encoding="utf-8").read())
              except SyntaxError as e:
                  errors.append(f"{path}:{e.lineno}: {e.msg}")
          if errors:
              print("Truncated or broken files detected:")
              for err in errors:
                  print(" ", err)
              sys.exit(1)
          print(f"All Python files parse cleanly.")
          EOF
      - name: Run tests with coverage
        run: pytest --cov=members_reader --cov-report=term-missing --cov-fail-under=80

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1