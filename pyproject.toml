[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "members-reader"
version = "0.1.0"
description = "A flexible CSV member reader that auto-detects name columns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anoop Jacob", email = "ajacobusa@gmail.com" }]
keywords = ["csv", "members", "reader", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# No runtime dependencies — standard library only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "build>=1.0",
    "anthropic>=0.25.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "reportlab>=4.0.0",
    "python-pptx>=0.6.21",
    # Google Drive backup (BACKUP_TO_DRIVE) - was relied on via the system
    # user-site but never declared, so a clean/isolated install (e.g. the
    # portable on-drive python) was missing it. Declared so `pip install -e .[dev]`
    # is complete and reproducible from requirements-lock.txt.
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
members-reader = "members_reader.cli:main"

[project.urls]
Homepage = "https://github.com/ajacobusa/members-reader"
"Bug Tracker" = "https://github.com/ajacobusa/members-reader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The product suite is quoteforge_tests (1490+ tests). The legacy members_reader
# scaffold under tests/ errors on collection and is excluded.
testpaths = ["quoteforge_tests"]
# Run in parallel by default (pytest-xdist): the suite is process-parallel-safe
# (per-test tmp_path + monkeypatched DB/OUTPUT_DIR), cutting wall-clock ~22min ->
# ~4.5min on a multi-core box. Override for a single serial run with `-n 0`.
addopts = "-n auto"

[tool.coverage.run]
source = ["quoteforge"]
