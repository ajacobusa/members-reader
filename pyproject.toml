[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "members-reader"
version = "0.1.0"
description = "A flexible CSV member reader that auto-detects name columns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anoop Jacob", email = "ajacobusa@gmail.com" }]
keywords = ["csv", "members", "reader", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# No runtime dependencies — standard library only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
members-reader = "members_reader.cli:main"

[project.urls]
Homepage = "https://github.com/ajacobusa/members-reader"
"Bug Tracker" = "https://github.com/ajacobusa/members-reader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["members_reader"]
